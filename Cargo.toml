[package]
name = "duckdb_bayes"
version = "0.1.0"
edition = "2021"
description = "DuckDB extension: BayesFactor t-test / correlation (JASP-compatible BF10)"
license = "MIT"
repository = "https://github.com/alitrack/duckdb_bayes"

[lib]
name = "bayes_ext"
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
strip = true

[dependencies]
quack-rs = "0.14"
libduckdb-sys = "1.10504"
libm = "0.2"
