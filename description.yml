extension:
  name: bayes_ext
  description: "BayesFactor / JASP-compatible Bayesian analyses - t-test, ANOVA, regression BF10 (JZS/Zellner, JASP default Cauchy priors)"
  version: 0.1.0
  language: Rust
  build: cargo
  license: MIT
  excluded_platforms: "wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl;windows_amd64_rtools;windows_amd64_mingw"
  requires_toolchains: "rust"
  maintainers:
    - alitrack

repo:
  github: alitrack/duckdb_bayes
  ref: refs/tags/v0.1.0
